<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Yulin Ann</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body>
    <nav>
        <p>Yulin Ann</p>

        <p>
            <a href="index.html">About Yulin Ann</a>
        </p>
    </nav>

    <main class="one-col">
        <section>
            <h1>Yulin Ann</h1>

            <p class="address">
                Athens, Georgia
                &bull;
                (470) 529-3655
                &bull;
                ta07010@uga.edu
            </p>
        </section>

        <hr>

        <section>
            <h2>Contact Yulin Ann</h2>

            <form
                method="POST"
                action="https://formsubmit.co/ta07010@uga.edu"
            >
                <p>
                    <label for="name">Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </p>

                <p>
                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </p>

                <p>
                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                    ></textarea>
                </p>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>
            &copy;
            <a href="index.html">Yulin Ann</a>

            <a
                href="https://www.linkedin.com/in/yulin-a-07752b244"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Yulin Ann's LinkedIn profile"
            >
                <i class="fa-brands fa-linkedin"></i>
            </a>
        </p>
    </footer>
</body>
</html>
